gap inner 5
gap outer 0

mouse follows-focus

bind alt-h : focus west
bind alt-j : focus south
bind alt-k : focus north
bind alt-l : focus east

bind alt-shift-h : swap west
bind alt-shift-j : swap south
bind alt-shift-k : swap north
bind alt-shift-l : swap east

bind alt-shift-left : resize width 50
bind alt-shift-right : resize width -50
bind alt-shift-b : balance

bind alt-1 : workspace 1
bind alt-2 : workspace 2
bind alt-3 : workspace 3
bind alt-4 : workspace 4
bind alt-5 : workspace 5
bind alt-6 : workspace 6
bind alt-7 : workspace 7
bind alt-8 : workspace 8
bind alt-9 : workspace 9

bind alt-shift-1 : send 1 --follow
bind alt-shift-2 : send 2 --follow
bind alt-shift-3 : send 3 --follow
bind alt-shift-4 : send 4 --follow
bind alt-shift-5 : send 5 --follow
bind alt-shift-6 : send 6 --follow
bind alt-shift-7 : send 7 --follow
bind alt-shift-8 : send 8 --follow
bind alt-shift-9 : send 9 --follow

bind alt-shift-t : toggle split
bind alt-shift-f : toggle float
bind ctrl-alt-cmd-r : reload

rule bundle="net.imput.helium" : workspace 1
rule bundle="com.superlogical.rex" : workspace 2
rule bundle="md.obsidian" : workspace 3
rule bundle="com.t3tools.t3code" : workspace 4

rule app="System Settings" : float
